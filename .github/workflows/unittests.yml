name: Unit Tests

on:
  push:
    branches: [main, task-1]
  pull_request:
    branches: [main, task-1]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Task 1 dependencies
        run: pip install -r requirements-task1.txt

      - name: Run Task 1 unit tests
        run: pytest tests/test_preprocess.py tests/test_config.py -v --tb=short
